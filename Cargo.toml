[package]
name = "cpm"
version = "0.1.0"
edition = "2024"
description = "A TUI tool to track your GitHub Copilot Premium request quota"
license = "MIT"
repository = "https://github.com/tknkaa/cpm"

[[bin]]
name = "cpm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
